{% extends "auth/base.html" %}
{% block title %}Login · Istilo Coffee Shop{% endblock %}

{% block content %}
<form method="post" action="{{ url_for('login') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="input-field">
        <label for="login-identifier">Email or phone</label>
        <input type="text" id="login-identifier" name="identifier"
               placeholder="Enter your email or phone" autocomplete="username" autofocus required>
    </div>
    <div class="input-field">
        <label for="login-password">Password</label>
        <div class="pass-wrap">
            <input type="password" id="login-password" name="password"
                   placeholder="Enter your password" autocomplete="current-password" required>
            <button type="button" class="eye-btn" aria-label="Show or hide password"
                    onclick="togglePass('login-password', 'login-eye')">
                <i class="fas fa-eye-slash" id="login-eye"></i>
            </button>
        </div>
    </div>
    <button type="submit" class="auth-btn">LOGIN</button>
    <div class="auth-link">
        Don't have an account? <a href="{{ url_for('register') }}">Register</a>
    </div>
</form>
{% endblock %}
