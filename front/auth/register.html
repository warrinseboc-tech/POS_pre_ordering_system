{% extends "auth/base.html" %}
{% block title %}Register · Istilo Coffee Shop{% endblock %}

{% block content %}
<form method="post" action="{{ url_for('register') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <p>We will email you a six-digit verification code before creating your account.</p>
    <div class="input-field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email"
               placeholder="Enter your email" autocomplete="email" required>
    </div>
    <div class="input-field">
        <label for="phone">Phone</label>
        <input type="tel" id="phone" name="phone" placeholder="Enter your phone number"
               autocomplete="tel" required>
    </div>
    <div class="input-field">
        <label for="reg-password">Password</label>
        <div class="pass-wrap">
            <input type="password" id="reg-password" name="password"
                   placeholder="At least 8 characters" autocomplete="new-password" minlength="8" required>
            <button type="button" class="eye-btn" aria-label="Show or hide password"
                    onclick="togglePass('reg-password', 'reg-eye')">
                <i class="fas fa-eye-slash" id="reg-eye"></i>
            </button>
        </div>
    </div>
    <button type="submit" class="auth-btn">REGISTER</button>
    <div class="auth-link">
        Already have an account? <a href="{{ url_for('login') }}">Login</a>
    </div>
</form>
{% endblock %}
