{% extends "auth/base.html" %}
{% block title %}Verify Email · Istillo Coffee Shop{% endblock %}

{% block content %}
<p>Enter the six-digit code sent to {{ session.get('pending_email') }}. The code expires in 10 minutes.</p>
<form method="post" action="{{ url_for('verify_email') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="input-field">
        <label for="otp">Verification code</label>
        <input type="text" id="otp" name="otp" inputmode="numeric" autocomplete="one-time-code"
               pattern="[0-9]{6}" maxlength="6" placeholder="123456" required autofocus>
    </div>
    <button type="submit" class="auth-btn">VERIFY EMAIL</button>
</form>
<form method="post" action="{{ url_for('resend_otp') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <button type="submit" class="auth-btn">RESEND CODE</button>
</form>
{% endblock %}
