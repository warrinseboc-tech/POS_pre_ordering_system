<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin — Drinks Management</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="main-app">
        <div class="admin-view">
            <div class="admin-layout">
                <aside class="admin-sidebar">
                    <div class="admin-logo">
                        <img src="istilo logo.png" alt="Istilo Logo" class="admin-logo-img">
                        <h1>Istilo</h1>
                        <button class="admin-menu-btn" onclick="toggleAdminSidebar()"><i class="fas fa-bars"></i></button>
                    </div>
                    <nav class="admin-nav">
                          <a href="/index.html" class="admin-nav-link"><i class="fas fa-home"></i> HOME</a>
                        <a href="/index.html" class="admin-nav-link active"><i class="fas fa-mug-hot"></i> DRINKS</a>
                        <a href="/index.html" class="admin-nav-link"><i class="fas fa-cookie"></i> SNACKS</a>
                        <a href="/index.html" class="admin-nav-link"><i class="fas fa-envelope"></i> ABOUT</a>
                        <a href="/index.html"class="admin-nav-link"><i class="fas fa-user"></i> PROFILE</a>
                    </nav>
                    <button class="admin-logout" onclick="handleLogout()"><i class="fas fa-sign-out-alt"></i> Log out</button>
                </aside>
                <main class="admin-main">
                    <div class="admin-top-bar">
                        <h2 class="admin-page-title">Drinks Management</h2>
                        <p class="admin-tagline">Add, Edit & Delete Drinks</p>
                        <div class="admin-badge">Admin</div>
                    </div>
                    <div class="add-form-card">
                        <h3>Add New Drink</h3>
                        <div class="form-grid">
                            <input type="text" id="drink-name" placeholder="Drink Name">
                            <input type="number" id="drink-price" placeholder="Price" step="1">
                            <select id="drink-status">
                                <option value="Available">Available</option>
                                <option value="Low Stock">Low Stock</option>
                                <option value="Unavailable">Unavailable</option>
                            </select>
                            <button class="add-btn" onclick="addDrink()">Add Drink</button>
                        </div>
                    </div>

                    <h3>hi</h3>
                    <div class="admin-card items-card">
                        <h3 class="card-title">Drinks List</h3>
                        <div class="items-header">
                            <span>#</span><span>Image</span><span>Name</span><span>Price</span><span>Status</span><span>Actions</span>
                        </div>
                        <div id="drinks-list"></div>
                    </div>
                </main>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
