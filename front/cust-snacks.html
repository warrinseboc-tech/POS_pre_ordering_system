<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snacks — Istilo Coffee Shop</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="main-app">
        <div class="customer-view">
            <div class="cust-layout">
                <aside class="cust-sidebar">
                    <div class="cust-logo">
                        <img src="istilo logo.png" alt="Istilo Logo" class="cust-logo-img">
                        <h1>Istilo</h1>
                        <button class="cust-menu-btn" onclick="toggleCustSidebar()"><i class="fas fa-bars"></i></button>
                    </div>
                    <nav class="cust-nav">
                        <a href="index.html" class="cust-nav-link"><i class="fas fa-home"></i> HOME</a>
                        <a href="cust-drinks.html" class="cust-nav-link"><i class="fas fa-mug-hot"></i> DRINKS</a>
                        <a href="cust-snacks.html" class="cust-nav-link active"><i class="fas fa-cookie"></i> SNACKS</a>
                        <a href="cust-about.html" class="cust-nav-link"><i class="fas fa-envelope"></i> ABOUT</a>
                        <a href="cust-profile.html" class="cust-nav-link"><i class="fas fa-user"></i> PROFILE</a>
                        <a href="cust-cart.html" class="cust-nav-link"><i class="fas fa-shopping-cart"></i> CART</a>
                    </nav>
                    <button class="cust-logout" onclick="handleLogout()"><i class="fas fa-sign-out-alt"></i> Log out</button>
                </aside>
                <main class="cust-main">
                    <div class="cust-top-bar">
                        <h2 class="cust-page-title">Snacks</h2>
                        <div class="cust-user">
                            <span id="cust-name">User</span>
                            <i class="fas fa-user-circle"></i>
                        </div>
                    </div>
                    <div class="menu-grid">
                        <div class="menu-item-card">
                            <img src="snack.png" alt="Butter Croissant" class="menu-img">
                            <h3>Butter Croissant</h3>
                            <p class="menu-price">₱35</p>
                            <button class="add-to-cart-btn" onclick="addToCart('Butter Croissant', 35)">Add to Cart</button>
                        </div>
                        <div class="menu-item-card">
                            <img src="snack.png" alt="Choco Muffin" class="menu-img">
                            <h3>Choco Muffin</h3>
                            <p class="menu-price">₱30</p>
                            <button class="add-to-cart-btn" onclick="addToCart('Choco Muffin', 30)">Add to Cart</button>
                        </div>
                        <div class="menu-item-card">
                            <img src="snack.png" alt="Choco Cookie" class="menu-img">
                            <h3>Choco Cookie</h3>
                            <p class="menu-price">₱25</p>
                            <button class="add-to-cart-btn" onclick="addToCart('Choco Cookie', 25)">Add to Cart</button>
                        </div>
                        <div class="menu-item-card">
                            <img src="snack.png" alt="Fudge Brownie" class="menu-img">
                            <h3>Fudge Brownie</h3>
                            <p class="menu-price">₱40</p>
                            <button class="add-to-cart-btn" onclick="addToCart('Fudge Brownie', 40)">Add to Cart</button>
                        </div>
                    </div>
                </main>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
